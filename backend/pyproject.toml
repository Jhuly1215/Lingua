[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-backend"
version = "0.1.0"
description = "Plataforma Computacional para la Investigación y Caracterización del Lenguaje en Personas con Afasia"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipo LINGUA" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: pruebas unitarias aisladas sin dependencias externas",
    "integration: pruebas de integracion con base de datos o endpoints",
    "supabase_live: pruebas que requieren conexion real a Supabase",
]
